<title>Crewe Roads Visited</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#fff; --fg:#111; --muted:#667; --line:#e3e5ea; --accent:#16a34a; --chip:#f1f3f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --fg:#eef0f4; --muted:#9aa3b2; --line:#2a2e37; --chip:#242831; }
  }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  #map { position:absolute; inset:0; }
  #panel { position:absolute; left:0; right:0; bottom:0; z-index:1000; background:var(--bg); border-radius:16px 16px 0 0;
    box-shadow:0 -4px 20px rgba(0,0,0,.25); height:46vh; height:46dvh; display:flex; flex-direction:column;
    transition:height .2s; padding-bottom:env(safe-area-inset-bottom,0); }
  #panel.min { height:92px; }
  #handle { padding:8px 14px 6px; cursor:pointer; }
  #handle .bar { width:40px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 8px; }
  #top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #count { font-weight:700; font-size:15px; }
  #status { font-size:12px; color:var(--muted); }
  #prog { height:6px; background:var(--chip); border-radius:3px; margin-top:6px; overflow:hidden; }
  #prog > div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  #controls { display:flex; gap:6px; padding:4px 14px 8px; }
  #search { flex:1; min-width:0; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--chip); color:var(--fg); font-size:16px; }
  button { font:inherit; font-size:13px; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--chip); color:var(--fg); }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #list { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; border-top:1px solid var(--line); }
  .row { display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); }
  .row input { width:22px; height:22px; accent-color:var(--accent); flex:none; }
  .row .nm { flex:1; font-size:15px; }
  .row .nm small { color:var(--muted); display:block; font-size:11px; }
  .row .go { flex:none; padding:6px 9px; }
  .row.nomap .go { display:none; }
  .leaflet-tooltip { font-weight:600; }
  #track { position:absolute; z-index:1000; top:calc(env(safe-area-inset-top,0px) + 10px); left:10px; padding:11px 14px; font-weight:700;
    box-shadow:0 2px 10px rgba(0,0,0,.3); background:var(--bg); }
  #track.on { background:#2563eb; color:#fff; border-color:#2563eb; }
  #toast { position:absolute; z-index:1001; left:50%; top:calc(env(safe-area-inset-top,0px) + 62px); transform:translateX(-50%);
    background:#16a34a; color:#fff; padding:9px 16px; border-radius:20px; font-weight:600; font-size:14px; opacity:0;
    transition:opacity .25s; pointer-events:none; white-space:nowrap; box-shadow:0 2px 10px rgba(0,0,0,.3); }
  #toast.show { opacity:1; }
  .me { width:18px; height:18px; border-radius:50%; background:#2563eb; border:3px solid #fff; box-shadow:0 0 0 2px rgba(37,99,235,.4); }
  #tools { padding:8px 14px 10px; display:flex; gap:6px; flex-wrap:wrap; border-top:1px solid var(--line); }
  #tools button { font-size:12px; }
</style>
</head>

    <button data-f="no">To do</button>
    <button data-f="yes">Done</button>
  </div>
  <div id="list"></div>
  <div id="tools">

URY CLOSE", "WESTHOLME CLOSE", "WESTMERE DRIVE", "WESTMINSTER STREET", "WESTON CLOSE", "WESTON ROAD", "WHARFDALE AVENUE", "WHEATFIELD DRIVE", "WHEATLEY ROAD", "WHEELMAN ROAD", "WHIRLOW ROAD", "WHITBY CLOSE", "WHITE AVENUE", "WHITLEY PLACE", "WHITTAKER CLOSE", "WILDERHOPE CLOSE", "WILDING DRIVE", "WILDING STREET", "WILLIAM MORREY CLOSE", "WILLIAM STREET", "WILLIAM WAY", "WILSON PLACE", "WINDSOR AVENUE", "WISTASTON ROAD", "WOOD STREET", "WOODLAND AVENUE", "WOODLAND GARDENS", "WORDSWORTH DRIVE", "WORSDELL CLOSE", "WREN DRIVE", "WYNTER CLOSE", "YATES STREET"];

const BBOX = "53.06,-2.52,53.14,-2.37";           // Crewe area (south,west,north,east)
const VISITED_KEY = "crewe-visited-v1";
const GEOM_KEY = "crewe-geom-v1";
const ENDPOINTS = ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];

// ---------- state ----------
let visited = new Set();
try { visited = new Set(JSON.parse(localStorage.getItem(VISITED_KEY) || "[]")); } catch(e){}
function saveVisited(){ try{ localStorage.setItem(VISITED_KEY, JSON.stringify([...visited])); }catch(e){} }

const norm = s => s.toUpperCase().replace(/[.’']/g,"").replace(/\bSAINT\b/g,"ST").replace(/[^A-Z0-9]+/g," ").trim();
const wanted = new Map();                           // normalised -> original name
STREETS.forEach(n => wanted.set(norm(n), n));
const layers = new Map();                           // name -> {group, line}

// ---------- map ----------
const map = L.map("map", { preferCanvas:true, zoomControl:false }).setView([53.098,-2.44], 14);
L.control.zoom({position:"topright"}).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);

const STYLE_NO  = {color:"#e11d48", weight:5, opacity:.75, lineCap:"round"};
const STYLE_YES = {color:"#16a34a", weight:7, opacity:.95, lineCap:"round"};

function toggle(name){
  visited.has(name) ? visited.delete(name) : visited.add(name);
  saveVisited(); restyle(name); renderList(); updateCount();
}
function restyle(name){
  const l = layers.get(name); if(!l) return;
  l.line.setStyle(visited.has(name) ? STYLE_YES : STYLE_NO);
}

function drawStreets(geom){
  let found = 0;
  for (const name of STREETS){
    const ways = geom[name]; if(!ways) continue;
    found++;
    const line = L.polyline(ways, visited.has(name)?STYLE_YES:STYLE_NO);
    const hit  = L.polyline(ways, {weight:26, opacity:0, color:"#000"});
    const group = L.featureGroup([line, hit]).addTo(map);
    hit.bindTooltip(name.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()), {sticky:true});
    group.on("click", e => { L.DomEvent.stopPropagation(e); toggle(name); });
    layers.set(name, {group, line, ways, bounds: group.getBounds()});
  }
  return found;
}

// ---------- data loading ----------
async function fetchGeom(){
  const q = `[out:json][timeout:90];way["highway"]["name"](${BBOX});out geom;`;
  let lastErr;
  for (const ep of ENDPOINTS){
    try{
      const r = await fetch(ep, {method:"POST", body:"data="+encodeURIComponent(q)});
      if(!r.ok) throw new Error("HTTP "+r.status);
      return await r.json();
    }catch(e){ lastErr = e; }
  }
  throw lastErr;
}
function buildGeom(osm){
  const out = {};
  for (const w of osm.elements){
    if(!w.geometry || !w.tags) continue;
    const key = norm(w.tags.name || "");
    const orig = wanted.get(key); if(!orig) continue;
    (out[orig] ||= []).push(w.geometry.map(p => [+p.lat.toFixed(5), +p.lon.toFixed(5)]));
  }
  return out;
}
async function load(){
  const st = document.getElementById("status");
  let geom = null;
  try{ geom = JSON.parse(localStorage.getItem(GEOM_KEY)||"null"); }catch(e){}
  if(!geom){
    try{
      geom = buildGeom(await fetchGeom());
      try{ localStorage.setItem(GEOM_KEY, JSON.stringify(geom)); }catch(e){}
    }catch(e){
      st.textContent = "Couldn't load roads (offline?)";
      renderList(); return;
    }
  }
  const n = drawStreets(geom);
  st.textContent = `${n} of ${STREETS.length} on map`;
  renderList();
}

// ---------- list UI ----------
let filter = "all", query = "";
const listEl = document.getElementById("list");
const title = s => s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()).replace(/\bSt\b/,"St");

function renderList(){
  const q = query.toLowerCase();
  const rows = [];
  STREETS.forEach((name,i) => {
    if(q && !name.toLowerCase().includes(q)) return;
    const v = visited.has(name);
    if(filter==="yes" && !v) return;
    if(filter==="no" && v) return;
    const onMap = layers.has(name);
    rows.push(`<div class="row ${onMap?"":"nomap"}" data-i="${i}">
      <input type="checkbox" ${v?"checked":""}>
      <div class="nm">${title(name)}${onMap?"":"<small>not found on map</small>"}</div>
      <button class="go">Show</button></div>`);
  });
  listEl.innerHTML = rows.join("") || '<div class="row"><div class="nm">Nothing here</div></div>';
}
function updateCount(){
  const total = STREETS.length, n = [...visited].filter(x=>STREETS.includes(x)).length;
  document.getElementById("count").textContent = `${n} / ${total} visited`;
  document.querySelector("#prog > div").style.width = (100*n/total)+"%";
}
listEl.addEventListener("click", e => {
  const row = e.target.closest(".row"); if(!row || row.dataset.i===undefined) return;
  const name = STREETS[+row.dataset.i];
  if(e.target.classList.contains("go")){
    const l = layers.get(name);
    if(l){ document.getElementById("panel").classList.add("min"); map.fitBounds(l.group.getBounds(),{maxZoom:17,padding:[40,40]}); }
  } else { toggle(name); }
});
document.getElementById("search").addEventListener("input", e => { query = e.target.value.trim(); renderList(); });
document.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll("[data-f]").forEach(x => x.classList.toggle("on", x===b));
  renderList();
}));
document.getElementById("handle").addEventListener("click", () => document.getElementById("panel").classList.toggle("min"));

// ---------- backup ----------
document.getElementById("exp").onclick = () => {
  const txt = JSON.stringify([...visited]);
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>alert("Backup copied to clipboard"), ()=>prompt("Copy this:",txt)); }
  else prompt("Copy this:", txt);
};
document.getElementById("imp").onclick = () => {
  const t = prompt("Paste backup:"); if(!t) return;
  try{ visited = new Set(JSON.parse(t)); saveVisited(); layers.forEach((_,n)=>restyle(n)); renderList(); updateCount(); }
  catch(e){ alert("That doesn't look like a valid backup."); }
};
document.getElementById("clr").onclick = () => {
  if(!confirm("Clear all visited roads?")) return;
  visited.clear(); saveVisited(); layers.forEach((_,n)=>restyle(n)); renderList(); updateCount();
};

// ---------- live location ----------
const AUTO_DIST = 15;    // metres from the road centre-line to count as "on" it
const MAX_ACC   = 30;    // ignore GPS fixes worse than this (metres)
const HITS_NEEDED = 3;   // consecutive fixes near a road before it's ticked (avoids junction pass-bys)

let watchId = null, meMarker = null, meCircle = null, follow = true, wakeLock = null;
const hits = {};
const trackBtn = document.getElementById("track");
const toastEl = document.getElementById("toast");
let toastTimer;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove("show"), 2500); }

function distToStreet(lat, lng, ways){
  const mx = 111320 * Math.cos(lat*Math.PI/180), my = 110540;
  let best = Infinity;
  for (const w of ways){
    for (let i=0; i<w.length-1; i++){
      const ax=(w[i][1]-lng)*mx,   ay=(w[i][0]-lat)*my;
      const bx=(w[i+1][1]-lng)*mx, by=(w[i+1][0]-lat)*my;
      const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
      const t = l2 ? Math.max(0, Math.min(1, -(ax*dx+ay*dy)/l2)) : 0;
      const d = Math.hypot(ax+t*dx, ay+t*dy);
      if (d < best) best = d;
    }
  }
  return best;
}

function onPos(pos){
  const {latitude:lat, longitude:lng, accuracy:acc} = pos.coords;
  const ll = [lat, lng];
  if (!meMarker){
    meMarker = L.marker(ll, {icon:L.divIcon({className:"", html:'<div class="me"></div>', iconSize:[18,18], iconAnchor:[9,9]}), zIndexOffset:1000}).addTo(map);
    meMarker.on("click", () => { follow = true; map.panTo(meMarker.getLatLng()); });
    meCircle = L.circle(ll, {radius:acc, color:"#2563eb", weight:1, fillOpacity:.1, interactive:false}).addTo(map);
    map.setView(ll, Math.max(map.getZoom(), 17));
  } else {
    meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(acc);
    if (follow) map.panTo(ll, {animate:true});
  }
  if (acc > MAX_ACC) return;

  const padLat = 0.00025, padLng = 0.0004;
  layers.forEach((l, name) => {
    if (visited.has(name)) return;
    const b = l.bounds;
    const inBox = lat > b.getSouth()-padLat && lat < b.getNorth()+padLat && lng > b.getWest()-padLng && lng < b.getEast()+padLng;
    if (inBox && distToStreet(lat, lng, l.ways) <= AUTO_DIST){
      hits[name] = (hits[name]||0) + 1;
      if (hits[name] >= HITS_NEEDED){
        visited.add(name); saveVisited(); restyle(name); renderList(); updateCount();
        toast("✓ " + title(name));
      }
    } else if (hits[name]) hits[name] = 0;
  });
}

async function keepAwake(){
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch(e){}
}
document.addEventListener("visibilitychange", () => { if (watchId !== null && document.visibilityState === "visible") keepAwake(); });
map.on("dragstart", () => { follow = false; });

function startTracking(){
  if (!navigator.geolocation){ alert("This browser doesn't support location."); return; }
  follow = true;
  watchId = navigator.geolocation.watchPosition(onPos, err => {
    toast(err.code === 1 ? "Location permission denied" : "Can't get location");
    if (err.code === 1) stopTracking();
  }, {enableHighAccuracy:true, maximumAge:1000, timeout:20000});
  trackBtn.classList.add("on"); trackBtn.textContent = "📍 Tracking…";
  document.getElementById("panel").classList.add("min");
  keepAwake();
}
function stopTracking(){
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  if (wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
  trackBtn.classList.remove("on"); trackBtn.textContent = "📍 Track me";
}
trackBtn.onclick = () => watchId === null ? startTracking() : stopTracking();

updateCount(); renderList(); load();
</script>
